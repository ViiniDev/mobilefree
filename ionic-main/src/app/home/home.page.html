<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
   </ion-buttons>
    <ion-title>Início</ion-title>
    <ion-text slot="end" class="ion-margin-end">
      <h3>{{usuario.nome}}</h3>
    </ion-text>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-card>
    <ion-card-header>
      <ion-card-title>Imobiliaria DWM - Vinícius Wanderley Arruda</ion-card-title>
      <ion-card-subtitle>Aplicativo Imobiliaria</ion-card-subtitle>
    </ion-card-header>
    <ion-card-content>
      <ion-list>
        <ion-item-sliding *ngFor="let imovel of lista_imovel">
          <ion-item>
            <ion-thumbnail slot="start">
              <img *ngIf="imovel.foto" [src]="'data:image/jpeg;base64,' + imovel.foto" />
              <img *ngIf="!imovel.foto" src="../../assets/imgs/thumbnail.svg" />
            </ion-thumbnail>
            <ion-label>
              {{imovel.tipo_display}} {{imovel.detalhes | uppercase}} {{imovel.finalidade_display}} {{imovel.quartos_display}}
            </ion-label>
            <ion-label slot="end" color="primary">
              {{imovel.tamanho}}
            </ion-label>
          </ion-item>
          <ion-item-options>
            <ion-item-option color="danger" (click)="excluirImovel(imovel.id)">
              Excluir
            </ion-item-option>
          </ion-item-options>
        </ion-item-sliding>        
      </ion-list>
    </ion-card-content>
  </ion-card>
</ion-content>
